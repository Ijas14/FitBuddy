<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBuddy – AI Workout Generator</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a href="/" class="brand">🏋️‍♂️ FitBuddy – AI Workout Generator</a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/view-all-users">Admin Dashboard</a>
      <a href="/docs" target="_blank">API Docs</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <h1>💪 FitBuddy - AI Workout Generator</h1>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.75rem;">
        Fill in your details to receive a personalized 7-day workout plan and a goal-aligned nutrition tip.
      </p>

      <form action="/generate-workout" method="POST">
        <div class="form-group">
          <label for="username">Name:</label>
          <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
          <label for="user_id">User ID:</label>
          <input type="number" id="user_id" name="user_id" required min="1">
        </div>

        <div class="form-group">
          <label for="age">Age:</label>
          <input type="number" id="age" name="age" required min="10" max="120">
        </div>

        <div class="form-group">
          <label for="weight">Weight (kg):</label>
          <input type="number" step="0.1" id="weight" name="weight" required min="20" max="350">
        </div>

        <div class="form-group">
          <label for="goal">Fitness Goal:</label>
          <input type="text" id="goal" name="goal" placeholder="e g., weight loss, flexibility" required>
        </div>

        <div class="form-group">
          <label for="intensity">Workout Intensity:</label>
          <select id="intensity" name="intensity" required>
            <option value="Low" selected>Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Generate Plan</button>
      </form>
    </div>
  </main>

  <footer>
    FitBuddy – AI Fitness Plan Generator &bull; Built with FastAPI & Google Gemini Models
  </footer>
</body>
</html>
